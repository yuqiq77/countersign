name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      # SQLite masks VARCHAR widths and timezone round-trips; the Postgres
      # channel (tests/integration/test_postgres.py) runs against the same
      # database engine the deployment uses.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: countersign
          POSTGRES_PASSWORD: countersign
          POSTGRES_DB: countersign_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U countersign"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Ruff format
        run: .venv/bin/ruff format --check .
      - name: Pyright
        run: .venv/bin/pyright
      - name: Import contracts
        run: .venv/bin/lint-imports
      - name: Tests
        env:
          COUNTERSIGN_TEST_POSTGRES_URL: postgresql+psycopg://countersign:countersign@localhost:5432/countersign_test
        run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir apps/web typecheck
      - name: Build
        run: pnpm --dir apps/web build
